[project]
name = "taiji-agent-runtime"
version = "0.1.0"
description = "A general S1/S2 agent runtime for MCP tools"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=2,<3",
]

[project.optional-dependencies]
browser = ["browser-harness==0.1.13; python_version >= '3.11'", "httpx[http2]>=0.28,<1"]
desktop = ["cua-driver>=0.33,<0.34; sys_platform == 'darwin'"]
sandbox = ["e2b-desktop>=2.4,<3"]

[project.scripts]
taiji-agent = "taiji_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taiji_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
