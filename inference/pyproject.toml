[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taiji-vllm"
version = "0.1.0"
description = "Taiji decisions and LoRA text generation on one shared vLLM engine"
readme = "README.md"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
taiji = "vllm_model:register"

[tool.setuptools]
py-modules = ["vllm_head", "vllm_prompt", "vllm_model", "vllm_backend"]
